---
# =============================================================================
# configure_switch_simple.yml
# The "single-file, minimal, runnable" version — mirrors the example you posted,
# good for quickly understanding and testing.
# For production, use site.yml (role version) in the project root instead.
#
# Run: ansible-playbook playbooks/configure_switch_simple.yml
# =============================================================================
- name: "Configure Edgecore Switch via CLI (simple version)"
  hosts: edgecore_switch01
  gather_facts: false
  # Enter privileged EXEC(enable) first, then config mode
  become: true
  become_method: ansible.netcommon.enable

  tasks:
    # -------------------------------------------------------------------------
    # Approach A: send commands line by line (recommended, clear state, easy to debug)
    # -------------------------------------------------------------------------
    - name: "Enter global configuration mode"
      ansible.netcommon.cli_command:
        command: "configure"

    - name: "Create VLAN 10 and name it"
      ansible.netcommon.cli_command:
        command: "{{ item }}"
      loop:
        - "vlan database"
        - "vlan 10 name Production_LAN media ethernet"
        - "exit"

    - name: "Leave configuration mode"
      ansible.netcommon.cli_command:
        command: "end"

    # -------------------------------------------------------------------------
    # Approach B: send multiple lines at once (mirrors your original \n form)
    # Note: whether \n can chain multiple lines depends on the firmware's CLI
    # behavior; sending line by line (approach A) is the most stable.
    # -------------------------------------------------------------------------
    # - name: "Run multi-line configuration commands"
    #   ansible.netcommon.cli_command:
    #     command: "configure\ninterface vlan 10\nname Production_LAN\nend"
    #   register: cli_output

    - name: "Review the current VLAN configuration"
      ansible.netcommon.cli_command:
        command: "show vlan"
      register: cli_output
      changed_when: false

    - name: "Show CLI Response"
      ansible.builtin.debug:
        var: cli_output.stdout_lines

    # -------------------------------------------------------------------------
    # Save: auto-answer y when a [y/n] confirmation appears
    # -------------------------------------------------------------------------
    - name: "Save running-config to startup-config"
      ansible.netcommon.cli_command:
        command: "copy running-config startup-config"
        prompt:
          - "(?i)\\[y/n\\]"
          - "(?i)startup-config"
        answer:
          - "y"
          - "y"
        check_all: true
      vars:
        ansible_command_timeout: 30
