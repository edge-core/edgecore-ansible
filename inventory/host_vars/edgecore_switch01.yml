---
# =============================================================================
# Per-host override example — put configuration specific to THIS switch here.
# These override the same-named vars in group_vars and the role defaults.
# =============================================================================

# Example: this switch only uses VLAN 10/30, and sets 1/3 as access vlan 30
edgecore_cli_vlans:
  - id: 10
    name: "Production_LAN"
  - id: 30
    name: "Management"

edgecore_cli_interfaces:
  - name: "ethernet 1/3"
    description: "MGMT_Port"
    mode: "access"
    access_vlan: 30
    enabled: true

edgecore_cli_svi:
  - vlan_id: 30
    ipv4: "192.168.30.1/24"
    enabled: true
