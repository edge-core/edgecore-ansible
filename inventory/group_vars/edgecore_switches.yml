---
# =============================================================================
# Group vars: connection settings shared by all edgecore_switches
# =============================================================================
# Edge-core Enterprise Switches (ECS series) use an IOS-like CLI, but Ansible
# has no official edgecore network platform. We therefore use the generic
# network_cli connection plugin + the cli_command module to send commands.
# =============================================================================

# --- Connection method ---
ansible_connection: ansible.netcommon.network_cli

# Use this project's own network platform plugins (terminal + cliconf) shipped
# in the edgecore.edgecos collection. This is what makes the generic
# ansible.netcommon.cli_command / cli_config modules work robustly against
# Edge-core ECS switches (prompt/enable/paging/save handled by the plugins).
# NOTE: the old generic value "ansible.netcommon.default" is no longer a valid
# network_os on modern ansible-core (it has no terminal plugin and raises
# "network os ansible.netcommon.default is not supported").
ansible_network_os: edgecore.edgecos.edgecore

# --- Credentials (use Ansible Vault in production, see README) ---
# NOTE: these are placeholders. Replace with your switch's real login, and
# prefer Ansible Vault (see the Security section of the README) over plaintext.
ansible_user: admin
ansible_password: "YourPassword"

# Password required to enter privileged EXEC (enable). Leave empty if none.
ansible_become: true
ansible_become_method: ansible.netcommon.enable
ansible_become_password: ""

# --- Timeouts (commands such as save can take longer) ---
ansible_command_timeout: 60
ansible_connect_timeout: 30

# Disable host key checking for lab testing convenience; in production, enable it
# and manage known_hosts.
ansible_host_key_checking: false
