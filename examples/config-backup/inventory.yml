# =============================================================================
# examples/config-backup/inventory.yml
# The switches to back up for the READ-ONLY config-backup example.
# Change the ansible_host values below to your switches' MANAGEMENT IPs.
# These are PLACEHOLDER addresses (RFC 5737 192.0.2.0/24), not real devices.
#
# This example only runs "show" commands; it NEVER changes a device. Add as
# many hosts to the edgecore_switches group as you need to back up.
# =============================================================================
all:
  children:
    edgecore_switches:
      hosts:
        edgecore_sw01:
          ansible_host: 192.0.2.11   # CHANGE ME: Switch 1 management IP
        edgecore_sw02:
          ansible_host: 192.0.2.12   # CHANGE ME: Switch 2 management IP
