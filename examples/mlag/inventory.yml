# =============================================================================
# examples/mlag/inventory.yml
# MLAG leaf pair for the copy-and-adapt MLAG provisioning example.
# Change the ansible_host values below to your two leaf switches' management
# IPs. These are PLACEHOLDER lab addresses, not real devices.
# =============================================================================
all:
  children:
    mlag_leaves:
      hosts:
        mlag_leaf01:
          ansible_host: 192.168.1.11   # CHANGE ME: leaf-1 management IP
        mlag_leaf02:
          ansible_host: 192.168.1.12   # CHANGE ME: leaf-2 management IP
