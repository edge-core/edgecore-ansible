---
# =============================================================================
# examples/mlag/host_vars/mlag_leaf02.yml
# Per-leaf MLAG data for LEAF-2. The ONLY differences from mlag_leaf01.yml are:
#   * mlag_mgmt_ip
#   * the port_channel values on the two UPLINK groups (4 and 5) are SWAPPED
#     relative to LEAF-1 -- see the asymmetry note below.
# =============================================================================

# Optional management SVI address for this leaf (RFC 5737 placeholder).
mlag_mgmt_ip: "192.0.2.12/24"

# Server groups 1-3 are IDENTICAL to LEAF-1 (dual-homed to the same servers).
mlag_groups:
  - group: 1
    port_channel: 1
    role: server
    description: "##SERVER-1##"
    members: ["ethernet 1/1", "ethernet 1/2"]
    native_vlan: 190
    tagged_vlans: "110,200"
  - group: 2
    port_channel: 2
    role: server
    description: "##SERVER-2##"
    members: ["ethernet 1/3", "ethernet 1/4"]
    native_vlan: 190
    tagged_vlans: "110,200"
  - group: 3
    port_channel: 3
    role: server
    description: "##SERVER-3##"
    members: ["ethernet 1/5", "ethernet 1/6"]
    native_vlan: 190
    tagged_vlans: "110,200"
  # --- ASYMMETRY (uplinks) ---
  # SWAPPED relative to LEAF-1: on LEAF-2, group 4 -> port-channel 5 (SPINE-B)
  # and group 5 -> port-channel 4 (SPINE-A), because each leaf's uplink
  # port-channels reach the opposite spine. The ethernet members stay the same
  # physical ports; only the group->port-channel mapping differs.
  - group: 4
    port_channel: 5            # LEAF-1 uses port-channel 4 here (swap)
    role: uplink
    description: "##UPLINK-SPINE-B##"
    members: ["ethernet 1/19", "ethernet 1/20"]
    native_vlan: 110
    tagged_vlans: "110,190,200"
  - group: 5
    port_channel: 4            # LEAF-1 uses port-channel 5 here (swap)
    role: uplink
    description: "##UPLINK-SPINE-A##"
    members: ["ethernet 1/21", "ethernet 1/22"]
    native_vlan: 110
    tagged_vlans: "110,190,200"
