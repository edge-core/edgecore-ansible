---
# =============================================================================
# examples/mlag/group_vars/mlag_leaves.yml
# Connection settings + the SHARED (identical-on-both-leaves) part of the MLAG
# data model. Per-leaf differences live in host_vars/mlag_leaf0{1,2}.yml.
#
# Mirrors inventory/group_vars/edgecore_switches.yml from the project root.
# Contains ZERO real secrets: replace the placeholder credentials and prefer
# Ansible Vault (see the main README "Security" section).
# =============================================================================

# --- Connection method ---
ansible_connection: ansible.netcommon.network_cli
# This project's own network platform plugins (terminal + cliconf) shipped in
# the edgecore.edgecos collection make the generic ansible.netcommon.cli_command
# module work robustly against Edge-core ECS switches.
ansible_network_os: edgecore.edgecos.edgecore

# --- Credentials (PLACEHOLDERS: replace and prefer Ansible Vault) ---
ansible_user: admin
ansible_password: "YourPassword"
# Privileged EXEC (enable). Leave the password empty if your switch has none.
ansible_become: true
ansible_become_method: ansible.netcommon.enable
ansible_become_password: ""

# --- Timeouts (save can take longer than normal commands) ---
ansible_command_timeout: 60
ansible_connect_timeout: 30

# =============================================================================
# Shared MLAG data model (identical on both leaves)
# =============================================================================

# Run "copy running-config startup-config" at the end of the playbook.
mlag_save_config: true

# MLAG domain name. Both leaves of a pair MUST use the same domain name.
#   CLI: mlag domain <name> peer-link port-channel <id>
mlag_domain: "LEAFPAIR"

# Peer-link (inter-switch link) between the two leaves.
#   CLI: interface port-channel <port_channel> / description ...
#        interface ethernet <member> / ... / channel-group <port_channel>
mlag_peer_link:
  port_channel: 28
  description: "##LEAF-PEER##"
  members:                       # physical ports bound via channel-group 28
    - "ethernet 1/23"
    - "ethernet 1/24"

# Representative VLAN set (generic names). The real site carried many more;
# add/trim to match your deployment.
#   CLI (inside "vlan database"): VLAN <id> name <name> media ethernet
mlag_vlans:
  - { id: 110, name: "Mgmt" }
  - { id: 190, name: "Servers" }
  - { id: 200, name: "Storage" }

# Tagged VLAN list carried across the peer-link and uplinks.
mlag_all_vlans: "110,190,200"
