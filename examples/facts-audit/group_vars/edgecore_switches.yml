---
# =============================================================================
# examples/facts-audit/group_vars/edgecore_switches.yml
# Connection settings + the read-only fact-collection parameters shared by all
# switches in the edgecore_switches group.
#
# Mirrors inventory/group_vars/edgecore_switches.yml from the project root and
# the sibling examples. Contains ZERO real secrets: replace the placeholder
# credentials and prefer Ansible Vault (see the main README "Security" section).
# =============================================================================

# --- Connection method ---
ansible_connection: ansible.netcommon.network_cli
# This project's own network platform plugins (terminal + cliconf) shipped in
# the edgecore.edgecos collection make the generic ansible.netcommon.cli_command
# module work robustly against Edge-core ECS switches.
ansible_network_os: edgecore.edgecos.edgecore

# --- Credentials (PLACEHOLDERS: replace and prefer Ansible Vault) ---
ansible_user: admin
ansible_password: "YourPassword"
# Privileged EXEC (enable). Leave the password empty if your switch has none.
# "show running-config" generally requires privileged EXEC, so enable here.
ansible_become: true
ansible_become_method: ansible.netcommon.enable
ansible_become_password: ""

# --- Timeouts (show running-config can be large on busy switches) ---
ansible_command_timeout: 60
ansible_connect_timeout: 30

# =============================================================================
# Read-only fact-collection parameters
# =============================================================================

# Where collected files are written ON THE CONTROL NODE (relative to this
# example directory, or set an absolute path). Created automatically if missing.
# All collected files land here; nothing is written to the device.
facts_output_dir: "./output"

# ---------------------------------------------------------------------------
# Parsing contract (SINGLE SOURCE OF TRUTH, shared by site.yml and the
# tests/parse_selftest.yml self-test so the two can never drift).
#
# Each regex uses Python `re` semantics via the Jinja2 regex_findall filter,
# with (?m) MULTILINE so ^/$ match per line. With multiple capture groups,
# regex_findall returns a LIST OF TUPLES (one tuple per matched row); the play
# turns each tuple into a dict.
#
# How to adapt to a different firmware: if your switch prints extra/different
# columns, keep the capture-group ORDER but widen/narrow the groups. See the
# README "Adapting the regexes" section for details.
# ---------------------------------------------------------------------------

# show mac-address-table rows -> (interface, mac, vlan, type, life_time)
#   - interface is non-greedy ".+?" so it tolerates an embedded space ("Eth 1/ 1")
#   - mac is the dash-separated 6-octet form (00-E0-0C-00-00-FD)
#   - vlan is digits; type is a single token; life_time is the trailing text
#     ("Delete on Reset" / "Delete on Timeout")
facts_mac_regex: '(?m)^\s*(.+?)\s+([0-9A-Fa-f]{2}(?:-[0-9A-Fa-f]{2}){5})\s+(\d+)\s+(\S+)\s+(.+?)\s*$'

# show arp rows -> (ip, mac, type, interface)
#   The leading "IP Address" anchor is a dotted-quad, so the "ARP Cache Timeout"
#   header, the column header, the dashes line, and the "Total entry : N" footer
#   never match -- only real cache entries do.
facts_arp_regex: '(?m)^\s*(\d{1,3}(?:\.\d{1,3}){3})\s+([0-9A-Fa-f]{2}(?:-[0-9A-Fa-f]{2}){5})\s+(\S+)\s+(\S+)\s*$'
