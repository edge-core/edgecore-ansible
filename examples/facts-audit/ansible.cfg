# =============================================================================
# examples/facts-audit/ansible.cfg
# Read automatically when running ansible-playbook from this directory.
# collections_paths points at this project's bundled collection so the
# network_os edgecore.edgecos.edgecore resolves without extra setup.
# See the main README (section "Delivering the collection to customers") for
# alternative ways to make Ansible find the collection.
# =============================================================================
[defaults]
inventory = ./inventory.yml
host_key_checking = False
retry_files_enabled = False
gathering = explicit
# Resolve the edgecore.edgecos collection shipped in this repo (two levels up).
collections_paths = ../../collection

[persistent_connection]
# Timeouts (seconds) for the network_cli connection.
connect_timeout = 30
command_timeout = 60
