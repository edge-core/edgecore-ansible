---
# =============================================================================
# examples/facts-audit/site.yml
# READ-ONLY fact collection from a group of Edge-core Enterprise Switches.
#
# For every host in the edgecore_switches group this play runs
# "show mac-address-table" and "show arp", parses the raw text into lists of
# dicts with pure Jinja2 regex (zero extra deps), and writes a timestamped
# per-host JSON + CSV for each table.
# All files land LOCALLY on the control node under facts_output_dir.
#
# STRICTLY READ-ONLY: every device command is a "show" command run through
# ansible.netcommon.cli_command with changed_when: false. There is NO
# "configure", NO "copy running-config startup-config", NO change of any kind.
# This play NEVER modifies a device.
#
# NOTE: table/column layout can vary by switch model and firmware. The parsing
# regexes live in group_vars/edgecore_switches.yml; adjust them there (and the
# self-test will keep matching) if your firmware's columns differ. See README.
# =============================================================================
# -----------------------------------------------------------------------------
# Setup play (control node only): compute ONE run-wide timestamp and create the
# local output directory before any host is touched. Running this on localhost
# once -- rather than with run_once on the device play -- gives every host the
# SAME stamp regardless of the execution strategy. gather_facts is false (keeps
# everything fast and device-free), so ansible_date_time is unavailable; the
# pipe lookup on the control node is the dependency-free way to get the stamp.
# -----------------------------------------------------------------------------
- name: "Prepare the control node for fact collection"
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    # group_vars/edgecore_switches.yml does not apply to localhost, so mirror
    # the default here. Override both with -e facts_output_dir=... if you change
    # the location.
    facts_output_dir: "./output"

  tasks:
    - name: "Compute one run-wide timestamp"
      ansible.builtin.set_fact:
        run_ts: "{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}"

    - name: "Ensure the local output directory exists"
      ansible.builtin.file:
        path: "{{ facts_output_dir }}"
        state: directory
        mode: "0755"

# -----------------------------------------------------------------------------
# Collection play: run only READ-ONLY show commands against each switch, parse,
# and write the results locally. run_ts is read from the localhost setup play
# via hostvars so every host shares the single stamp.
# -----------------------------------------------------------------------------
- name: "Collect read-only facts from Edge-core switches (MAC/ARP)"
  hosts: edgecore_switches
  gather_facts: false

  vars:
    # The one run-wide timestamp computed by the setup play above.
    run_ts: "{{ hostvars['localhost'].run_ts }}"

  tasks:
    # -------------------------------------------------------------------------
    # 0) Read-only connection pre-check (safe; never reports changed)
    # -------------------------------------------------------------------------
    - name: "Pre-check: switch version (connection health)"
      ansible.netcommon.cli_command:
        command: "show version"
      register: facts_version
      changed_when: false
      # Harmless if the model prints a different banner; keep going regardless.
      failed_when: false

    - name: "Show pre-check output"
      ansible.builtin.debug:
        var: facts_version.stdout_lines | default([])

    # -------------------------------------------------------------------------
    # 1) Collect raw command output (all READ-ONLY, never changed)
    # -------------------------------------------------------------------------
    - name: "Collect: show mac-address-table"
      ansible.netcommon.cli_command:
        command: "show mac-address-table"
      register: facts_mac_raw
      changed_when: false

    - name: "Collect: show arp"
      ansible.netcommon.cli_command:
        command: "show arp"
      register: facts_arp_raw
      changed_when: false

    # -------------------------------------------------------------------------
    # 2) Parse MAC / ARP text into lists of dicts.
    #    regex_findall with multiple capture groups returns a list of
    #    group-tuples; loop over the tuples and build one dict per row. This is
    #    the SAME parsing the self-test exercises (regexes are shared via
    #    group_vars), so the two can never drift.
    # -------------------------------------------------------------------------
    - name: "Parse MAC address table into a list of dicts"
      ansible.builtin.set_fact:
        mac_rows: >-
          {{ mac_rows | default([]) + [{
               'interface': item.0,
               'mac': item.1,
               'vlan': item.2,
               'type': item.3,
               'life_time': item.4
             }] }}
      loop: "{{ facts_mac_raw.stdout | default('') | regex_findall(facts_mac_regex) }}"
      loop_control:
        label: "{{ item.1 }}"

    - name: "Parse ARP table into a list of dicts"
      ansible.builtin.set_fact:
        arp_rows: >-
          {{ arp_rows | default([]) + [{
               'ip': item.0,
               'mac': item.1,
               'type': item.2,
               'interface': item.3
             }] }}
      loop: "{{ facts_arp_raw.stdout | default('') | regex_findall(facts_arp_regex) }}"
      loop_control:
        label: "{{ item.0 }}"

    - name: "Ensure parsed lists are always defined (empty when nothing matched)"
      ansible.builtin.set_fact:
        mac_rows: "{{ mac_rows | default([]) }}"
        arp_rows: "{{ arp_rows | default([]) }}"

    - name: "Preview parsed structures"
      ansible.builtin.debug:
        msg:
          - "MAC entries: {{ mac_rows | length }}"
          - "ARP entries: {{ arp_rows | length }}"

    # -------------------------------------------------------------------------
    # 3) Write all output files to the control node (delegate_to: localhost).
    #    JSON via to_nice_json, CSV via the dependency-free templates.
    # -------------------------------------------------------------------------
    - name: "Write MAC table JSON"
      ansible.builtin.copy:
        content: "{{ mac_rows | to_nice_json }}\n"
        dest: "{{ facts_output_dir }}/{{ inventory_hostname }}_mac_{{ run_ts }}.json"
        mode: "0644"
      delegate_to: localhost

    - name: "Write ARP table JSON"
      ansible.builtin.copy:
        content: "{{ arp_rows | to_nice_json }}\n"
        dest: "{{ facts_output_dir }}/{{ inventory_hostname }}_arp_{{ run_ts }}.json"
        mode: "0644"
      delegate_to: localhost

    - name: "Write MAC table CSV"
      ansible.builtin.copy:
        content: "{{ lookup('template', 'templates/mac_table.csv.j2', template_vars={'rows': mac_rows}) }}"
        dest: "{{ facts_output_dir }}/{{ inventory_hostname }}_mac_{{ run_ts }}.csv"
        mode: "0644"
      delegate_to: localhost

    - name: "Write ARP table CSV"
      ansible.builtin.copy:
        content: "{{ lookup('template', 'templates/arp_table.csv.j2', template_vars={'rows': arp_rows}) }}"
        dest: "{{ facts_output_dir }}/{{ inventory_hostname }}_arp_{{ run_ts }}.csv"
        mode: "0644"
      delegate_to: localhost

    - name: "Report written files"
      ansible.builtin.debug:
        msg:
          - "{{ facts_output_dir }}/{{ inventory_hostname }}_mac_{{ run_ts }}.{json,csv}"
          - "{{ facts_output_dir }}/{{ inventory_hostname }}_arp_{{ run_ts }}.{json,csv}"
