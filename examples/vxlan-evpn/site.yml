---
# =============================================================================
# examples/vxlan-evpn/site.yml
# Provision a 2-VTEP VXLAN BGP-EVPN fabric on a pair of Edge-core Enterprise
# Switches (L2 VNI + L3 VNI/VRF).
#
# Renders the per-switch CLI from the VXLAN/EVPN variables (templates/
# vxlan_config_lines.j2) and sends it line by line over the generic
# ansible.netcommon.cli_command module, mirroring the project's edgecore_cli
# role conventions (prompt/answer save, "% Invalid"/"Error" failed_when guard).
#
# Flow: privileged EXEC (enable, via become) -> read-only pre-check ->
#       configure -> apply lines -> end -> save.
#
# WARNING: Enabling VXLAN / BGP-EVPN is DISRUPTIVE to the data plane. Run inside
# a maintenance window and preview with --check first.
#
# NOTE: VXLAN / EVPN CLI syntax can vary by switch model and firmware. Treat the
# device CLI guide and context-sensitive "?" help as the source of truth.
# =============================================================================
- name: "Provision VXLAN BGP-EVPN on the Edge-core VTEP pair"
  hosts: vxlan_vteps
  gather_facts: false

  tasks:
    # -------------------------------------------------------------------------
    # 0) Read-only pre-checks (safe in --check; never report changed)
    # -------------------------------------------------------------------------
    - name: "Pre-check: switch version (connection health)"
      ansible.netcommon.cli_command:
        command: "show version"
      register: vxlan_precheck_version
      changed_when: false

    - name: "Pre-check: current VXLAN state"
      ansible.netcommon.cli_command:
        command: "show vxlan"
      register: vxlan_precheck_state
      changed_when: false
      # Harmless if VXLAN is not yet configured / command unsupported on model.
      failed_when: false

    - name: "Show pre-check output"
      ansible.builtin.debug:
        msg:
          - "{{ vxlan_precheck_version.stdout_lines | default([]) }}"
          - "{{ vxlan_precheck_state.stdout_lines | default([]) }}"

    # -------------------------------------------------------------------------
    # 1) Render the config command list from the template (per-host)
    # -------------------------------------------------------------------------
    - name: "Generate the VXLAN/EVPN config command list from the template"
      ansible.builtin.set_fact:
        vxlan_config_lines: >-
          {{ (lookup('template', 'templates/vxlan_config_lines.j2')).splitlines()
             | map('trim') | select('ne', '') | list }}

    - name: "Preview the VXLAN/EVPN config commands to be sent"
      ansible.builtin.debug:
        var: vxlan_config_lines

    # -------------------------------------------------------------------------
    # 2) Enter config mode and apply line by line
    #    become: true runs enable first to reach privileged EXEC.
    # -------------------------------------------------------------------------
    - name: "Enter global configuration mode"
      ansible.netcommon.cli_command:
        command: "configure"
      when: not ansible_check_mode

    - name: "Apply VXLAN/EVPN configuration line by line"
      ansible.netcommon.cli_command:
        command: "{{ item }}"
      loop: "{{ vxlan_config_lines }}"
      register: vxlan_apply
      when: not ansible_check_mode
      # Empty output is normal for many config commands; only fail on errors.
      failed_when: >-
        vxlan_apply.stdout is defined and
        ('% Invalid' in (vxlan_apply.stdout | default('')) or
         'Error' in (vxlan_apply.stdout | default('')))

    - name: "Leave configuration mode"
      ansible.netcommon.cli_command:
        command: "end"
      when: not ansible_check_mode

    # -------------------------------------------------------------------------
    # 3) Save: copy running-config startup-config
    #    Some firmware prompts for confirmation; auto-answer with prompt/answer.
    # -------------------------------------------------------------------------
    - name: "Save configuration (running-config -> startup-config)"
      ansible.netcommon.cli_command:
        command: "copy running-config startup-config"
        prompt:
          - "(?i)startup-config"
          - "(?i)\\[y/n\\]"
          - "(?i)continue"
        answer:
          - "y"
          - "y"
          - "y"
        check_all: true
      register: vxlan_save
      when:
        - vxlan_save_config | bool
        - not ansible_check_mode

    - name: "Show save result"
      ansible.builtin.debug:
        var: vxlan_save.stdout_lines
      when:
        - vxlan_save_config | bool
        - not ansible_check_mode
