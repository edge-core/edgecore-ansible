---
# =============================================================================
# examples/vxlan-evpn/host_vars/vtep_b.yml
# Per-switch VXLAN BGP-EVPN data for Switch B. The ONLY differences from
# vtep_a.yml are the four values below; everything else is shared and lives in
# group_vars/vxlan_vteps.yml.
#
# Switch B faces Host D (20.20.20.2) on access VLAN 30, with its VTEP source
# IP 19.19.19.2 on the underlay SVI. Its remote peer is Switch A (19.19.19.1).
# =============================================================================

# VTEP source IP: the local tunnel-endpoint address on the underlay SVI
# (interface vlan <underlay_vlan>). Unique per switch.
#   CLI: interface vlan <underlay_vlan> / ip address <vtep_ip> 255.255.255.0
vtep_ip: "19.19.19.2"

# Access VLAN carried by the L2 VNI on this switch (Host D's VLAN).
#   CLI (inside vlan database): vlan <access_vlan>
#        interface <access_port> / switchport allow vlan add <access_vlan> untagged
#        switchport native vlan <access_vlan>
#        ip vrf bind <vrf> <access_vlan>
access_vlan: 30

# Access SVI address: the gateway IP on the access VLAN's SVI.
#   CLI: interface vlan <access_vlan> / ip address <access_svi_ip>
access_svi_ip: "20.20.20.1 255.255.255.0"

# Remote VTEP = the PEER switch's VTEP source IP. For Switch B this is
# Switch A's VTEP (19.19.19.1). It is used BOTH as the L2 VNI flood target
# (r-vtep) and as the BGP-EVPN neighbor.
#   CLI: vxlan vni <l2_vni> flood r-vtep <remote_vtep_ip>
#        neighbor <remote_vtep_ip> remote-as <bgp_asn>
#        l2vpn evpn neighbor <remote_vtep_ip> activate
#
# NOTE (scaling): with only two VTEPs there is exactly one remote peer. For a
# third VTEP you would need an r-vtep / neighbor entry per remote peer (a full
# mesh, or a BGP route-reflector). See the README "Limitations" section.
remote_vtep_ip: "19.19.19.1"
