---
# =============================================================================
# site.yml — main playbook (role-based; recommended for production)
# Run: ansible-playbook site.yml
#      ansible-playbook site.yml --check --diff   # preview
#      ansible-playbook site.yml --limit edgecore_switch01
# =============================================================================
- name: "Configure Edge-core Enterprise Switch (role version)"
  hosts: edgecore_switches
  gather_facts: false          # network devices usually cannot run Python, so skip facts

  # If you need ansible_date_time for backup filenames, enable the lines below to
  # use the minimal subset of setup:
  # gather_facts: true
  # gather_subset: min

  roles:
    - role: edgecore_cli
