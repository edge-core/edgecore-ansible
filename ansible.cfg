# =============================================================================
# Ansible project configuration file
# This file is read automatically when running ansible-playbook in this directory.
# =============================================================================
[defaults]
inventory = ./inventory/hosts.yml
roles_path = ./roles
host_key_checking = False
retry_files_enabled = False
# Output callback: use the built-in 'default' (no extra collection required).
# The 'yaml' callback lives in the community.general collection on modern
# ansible-core; using 'default' keeps this project dependency-free.
stdout_callback = default
# Common for network devices: disable fact gathering to speed things up
gathering = explicit

[persistent_connection]
# Timeouts (seconds) for the network_cli connection
connect_timeout = 30
command_timeout = 60
