---
# =============================================================================
# roles/edgecore_cli/defaults/main.yml
# Default variables — customers only need to override these to apply their own
# configuration; there is no need to edit tasks.
# Can be overridden in host_vars / group_vars / playbook vars.
# =============================================================================

# Whether to save running-config to startup-config after applying settings
edgecore_cli_save_config: true

# Whether to back up (show running-config) to the local machine before applying
edgecore_cli_backup_before: true
edgecore_cli_backup_dir: "./backups"

# --- List of VLANs to create ---
# Maps to CLI:
#   configure
#   vlan database
#   vlan <id> name <name> media ethernet
#   exit
edgecore_cli_vlans:
  - id: 10
    name: "Production_LAN"
  - id: 20
    name: "Guest_WiFi"

# --- Interface configuration list ---
# Maps to CLI:
#   configure
#   interface ethernet 1/1
#   description <desc>
#   switchport mode <access|trunk>
#   switchport access vlan <id>            (access mode)
#   switchport trunk allowed vlan add <id> (trunk mode)
#   no shutdown
#   exit
edgecore_cli_interfaces:
  - name: "ethernet 1/1"
    description: "Uplink_to_Core"
    mode: "trunk"
    trunk_allowed_vlans: "10,20"
    enabled: true

  - name: "ethernet 1/2"
    description: "PC_Production"
    mode: "access"
    access_vlan: 10
    enabled: true

# --- SVI (VLAN interface) and IP, optional ---
# Maps to CLI:
#   configure
#   interface vlan <id>
#   ip address <ip>/<prefix>
#   exit
edgecore_cli_svi:
  - vlan_id: 10
    ipv4: "192.168.10.1/24"
    enabled: true
