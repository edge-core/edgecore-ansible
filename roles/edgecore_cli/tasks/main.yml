---
# =============================================================================
# roles/edgecore_cli/tasks/main.yml
# Send CLI commands to an Edge-core Enterprise Switch over the generic
# network_cli connection.
# Command-mode flow: privileged EXEC(enable) -> configure -> ... -> end
# =============================================================================

# -----------------------------------------------------------------------------
# 0) Connection test / grab version to confirm the CLI responds
# -----------------------------------------------------------------------------
- name: "Grab switch version (connection health check)"
  ansible.netcommon.cli_command:
    command: "show version"
  register: edgecore_cli_version
  changed_when: false

- name: "Show version info"
  ansible.builtin.debug:
    var: edgecore_cli_version.stdout_lines

# -----------------------------------------------------------------------------
# 1) Back up running-config to the control node before applying
# -----------------------------------------------------------------------------
- name: "Create backup directory"
  ansible.builtin.file:
    path: "{{ edgecore_cli_backup_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  run_once: true
  when: edgecore_cli_backup_before | bool

- name: "Grab running-config"
  ansible.netcommon.cli_command:
    command: "show running-config"
  register: edgecore_cli_running
  changed_when: false
  when: edgecore_cli_backup_before | bool

- name: "Write running-config to a local backup file"
  ansible.builtin.copy:
    content: "{{ edgecore_cli_running.stdout }}"
    dest: "{{ edgecore_cli_backup_dir }}/{{ inventory_hostname }}_{{ ansible_date_time.iso8601_basic_short | default('backup') }}.cfg"
    mode: "0644"
  delegate_to: localhost
  when:
    - edgecore_cli_backup_before | bool
    - edgecore_cli_running.stdout is defined

# -----------------------------------------------------------------------------
# 2) Build the list of config commands to send, from the template
# -----------------------------------------------------------------------------
- name: "Generate the config command list from the template"
  ansible.builtin.set_fact:
    edgecore_cli_config_lines: >-
      {{ (lookup('template', 'config_lines.j2')).splitlines()
         | map('trim') | select('ne', '') | list }}

- name: "Preview the config commands to be sent (useful in check/verbose mode)"
  ansible.builtin.debug:
    var: edgecore_cli_config_lines

# -----------------------------------------------------------------------------
# 3) Enter config mode and apply line by line
#    - become: true automatically runs enable first to reach privileged EXEC
#    - each command is sent with cli_command, staying in the same CLI session
# -----------------------------------------------------------------------------
- name: "Enter global configuration mode"
  ansible.netcommon.cli_command:
    command: "configure"

- name: "Apply configuration line by line"
  ansible.netcommon.cli_command:
    command: "{{ item }}"
  loop: "{{ edgecore_cli_config_lines }}"
  register: edgecore_cli_apply
  # Some commands returning an empty string is normal, do not treat as an error
  failed_when: >-
    edgecore_cli_apply.stdout is defined and
    ('% Invalid' in (edgecore_cli_apply.stdout | default('')) or
     'Error' in (edgecore_cli_apply.stdout | default('')))

- name: "Leave configuration mode"
  ansible.netcommon.cli_command:
    command: "end"

# -----------------------------------------------------------------------------
# 4) Save: copy running-config startup-config
#    Some firmware shows a confirmation prompt; use prompt/answer to auto-reply y
# -----------------------------------------------------------------------------
- name: "Save configuration (running-config -> startup-config)"
  ansible.netcommon.cli_command:
    command: "copy running-config startup-config"
    prompt:
      - "(?i)startup-config"        # matches "...startup-config? [y/n]" and similar
      - "(?i)\\[y/n\\]"
      - "(?i)continue"
    answer:
      - "y"
      - "y"
      - "y"
    check_all: true
  register: edgecore_cli_save
  when: edgecore_cli_save_config | bool

- name: "Show save result"
  ansible.builtin.debug:
    var: edgecore_cli_save.stdout_lines
  when: edgecore_cli_save_config | bool
